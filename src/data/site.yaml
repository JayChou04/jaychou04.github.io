bio: |
  I'm currently a research assistant at the <a href="https://sites.google.com/site/yitingchen0524/hcis-lab" target="_blank" rel="noopener">Human-Centered Intelligent System Lab</a>, NYCU, working on physical AI — recently dive into contact-rich manipulation domains.

  I earned my B.S. from the Department of Mechanical and Electro-Mechanical Engineering, NSYSU, where I built my foundation in good old-fashioned engineering and robotics hardware knowledges. During my undergrad, I also spent a summer as a visiting scholar at the <a href="https://erl.ucsd.edu/" target="_blank" rel="noopener">Existential Robotics Lab</a>, UC San Diego, working on efficient ways to leverage offline demonstrations with online RL. Outside the lab, I'm into <a href="https://www.instagram.com/benjamin___photography/" target="_blank" rel="noopener">photography</a> and badminton — feel free to reach out over email.
